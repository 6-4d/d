{g:[116,178,86],road:[196,176,146],edge:[158,138,110],l1:[62,150,80],l2:[110,184,96],water:[78,166,202],shore:[222,204,150],fl:[255,214,90],snow:0,la:1,lily:1,tint:[255,220,120,.09]},
{g:[196,164,94],road:[178,150,120],edge:[142,114,90],l1:[224,116,48],l2:[236,176,60],water:[104,152,164],shore:[190,160,110],fl:[214,84,48],snow:0,la:.9,lily:.25,tint:[255,150,70,.11]},
{g:[238,243,249],road:[172,166,168],edge:[138,132,136],l1:[66,108,94],l2:[90,132,112],water:[198,226,242],shore:[246,248,252],fl:[255,255,255],snow:1,la:0,lily:0,tint:[170,200,255,.09]}];
const pal=JSON.parse(JSON.stringify(P[0]));pal.i=0;pal.e=0;
let sv=0,skip=false;

const rgb=(c,k=1)=>`rgb(${c[0]*k|0},${c[1]*k|0},${c[2]*k|0})`;
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ---------- drawing tools (shared by sprites and the main canvas) ---------- */

const circ=(x,y,r,c)=>{G.fillStyle=c;G.beginPath();G.arc(x,y,r,0,TAU);G.fill()};

F.oak=(rn,k,r)=>{sh(0,0,r*.95);const la=V.la;if(la>.03){G.globalAlpha=la;blob(r,rn,V.l1,5+k%3,.5,.6);blob(r,rn,V.l2,3+k%2,.45,.3);G.globalAlpha=1}if(la<.97)bare(r,k,1-la)};

F.willow=(rn,k,r)=>{sh(0,0,r*.95);const la=V.la;if(la>.03){G.globalAlpha=la;circ(0,0,r*.85,V.l1);G.strokeStyle=V.l2;G.lineWidth=2.6;G.lineCap='round';G.beginPath();for(let i=0;i<18;i++){const a=i*TAU/18+rn()*.2;G.moveTo(Math.cos(a)*r*.3,Math.sin(a)*r*.3);G.lineTo(Math.cos(a)*r*.95,Math.sin(a)*r*.95)}G.stroke();circ(0,0,r*.28,V.d1);G.globalAlpha=1}if(la<.97)bare(r,k+5,1-la)};
F.pine=(rn,k,r)=>{sh(0,0,r);const n=9+k%4,rot=rn()*3;stars(r,n,.58,V.d1,rot);stars(r*.8,n,.58,V.l1,rot+.15);stars(r*.55,n,.6,V.l2,rot+.3);snowStars(rn,r,n,rot)};

F.fern=(rn,k,r)=>{G.strokeStyle=V.fern||V.l1;G.lineWidth=2.6;G.lineCap='round';G.beginPath();const n=6+k%3;for(let i=0;i<n;i++){const a=i*TAU/n+rn()*.4,L=r*(.8+rn()*.2),ex=Math.cos(a)*L,ey=Math.sin(a)*L;G.moveTo(0,0);G.lineTo(ex,ey);for(let j=1;j<5;j++){const px=ex*j/5,py=ey*j/5,l=(1-j/5)*r*.35;G.moveTo(px,py);G.lineTo(px+Math.cos(a+1.1)*l,py+Math.sin(a+1.1)*l);G.moveTo(px,py);G.lineTo(px+Math.cos(a-1.1)*l,py+Math.sin(a-1.1)*l)}}G.stroke()};

const PAL4=['#f48fb1','#ffb74d','#fff3c4','#ce93d8'];
function bloom(sid,x,y,t,rn){

  else{if(t<.45){ell(x,y+7,6,2.5,'#fff');G.strokeStyle='#6a9a6a';G.lineWidth=1.6;G.beginPath();G.moveTo(x,y+6);G.lineTo(x,y-3);G.stroke();circ(x,y-4,2.8,'#fff')}else if(t<.8){for(let i=0;i<5;i++)circ(x+Math.cos(i*1.26)*3.4,y+Math.sin(i*1.26)*3.4,2.8,'#3f7a4a');for(let i=0;i<3;i++)circ(x+(i-1)*2,y,1.6,'#c8423c')}else{G.strokeStyle='#cfe0f0';G.lineWidth=2;G.beginPath();for(let i=-2;i<=2;i++){G.moveTo(x+i*2.5,y+4);G.lineTo(x+i*3.5,y-4)}G.stroke()}}

F.flower=(rn,k,r)=>{const n=2+k%5;for(let i=0;i<n;i++)bloom(V.sid,(rn()-.5)*r*1.5,(rn()-.5)*r*1.2,rn(),rn)};

  ctx.fillStyle='rgba(60,40,20,.15)';ctx.beginPath();
  for(let cx=Math.floor(x0/CS);cx<=Math.floor(x1/CS);cx++)for(let cy=Math.floor(y0/CS);cy<=Math.floor(y1/CS);cy++){
    const c=grid.get(key(cx,cy));if(!c)continue;
    for(const o of c.h){const sx=o.x+o.r*.22,sy=o.y+o.r*.28,q=o.r*o.sr*(o.dec?.3+.7*pal.la:1);ctx.moveTo(sx+q,sy);ctx.arc(sx,sy,q,0,TAU)}
  }
  ctx.fill();
}
function drawProps(x0,y0,x1,y1,list){
  for(let cx=Math.floor(x0/CS);cx<=Math.floor(x1/CS);cx++)for(let cy=Math.floor(y0/CS);cy<=Math.floor(y1/CS);cy++){
    const c=grid.get(key(cx,cy));if(!c)continue;
    for(const o of c[list])ctx.drawImage(SPR[o.t].list[o.k],o.x-o.w/2,o.y-o.w/2,o.w,o.w);
  }
}
const runs=[];
function draw(dt){
  const z=cam.z,hw=W_/2/z,hh=H_/2/z,x0=cam.x-hw-120,y0=cam.y-hh-120,x1=cam.x+hw+120,y1=cam.y+hh+120;
  G=ctx;ctx.setTransform(Rd*z,0,0,Rd*z,Rd*(W_/2-cam.x*z),Rd*(H_/2-cam.y*z));ctx.lineJoin='round';ctx.lineCap='butt';ctx.globalAlpha=1;
  const i0=Math.max(0,idx-45),i1=Math.min(pts.length-1,idx+90);
  runs.length=0;let s=i0;for(let i=i0+1;i<=i1+1;i++)if(i>i1||pts[i].b!==pts[s].b){runs.push([pts[s].b,s]);s=i}
  // ground: base colour + soft half-plane gradients at each biome boundary (independent of seasons for non-grass biomes)
  const first=runs[0][0];
  if(B[first].t==='sea'){ctx.fillStyle=rgb(TR.sea.g);ctx.fillRect(x0,y0,x1-x0,y1-y0);ctx.fillStyle=wavePat;ctx.fillRect(x0,y0,x1-x0,y1-y0)}
  else{ctx.fillStyle=rgb(gcol(first));ctx.fillRect(x0,y0,x1-x0,y1-y0)}
  for(let ri=1;ri<runs.length;ri++){
    const b=runs[ri][0],st=runs[ri][1],prevSea=B[runs[ri-1][0]].t==='sea',sea=B[b].t==='sea';
    if(sea){gz(st,SAND,50);gz(st+4,TR.sea.g,40,wavePat)}
    else if(prevSea){gz(st,SAND,30);gz(st+4,gcol(b),90)}
    else gz(st,gcol(b),220);
  }
  for(const l of lakes)if(Math.hypot(l.x-cam.x,l.y-cam.y)<Math.hypot(hw,hh)+l.rx+200)lake(l);
  for(const r of rivers)if(Math.abs(along(r,cam.x,cam.y))<Math.hypot(hw,hh)+r.hw+200)river(r);
  ctx.lineCap='round';path(i0,i1);ctx.strokeStyle=S.edge;ctx.lineWidth=W+14;ctx.stroke();ctx.strokeStyle=S.road;ctx.lineWidth=W;ctx.stroke();
  dashes(i0,i1);ctx.lineCap='butt';drawMarks();
  let a=i0;for(let i=i0+1;i<=i1+1;i++)if(i>i1||pts[i].br!==pts[a].br){if(pts[a].br&&i-1>a)bridge(a,i-1);a=i}
  drawShadows(x0,y0,x1,y1);
  drawProps(x0,y0,x1,y1,'g');
  drawCar();drawSmoke();
  drawProps(x0,y0,x1,y1,'h');
  ctx.setTransform(Rd,0,0,Rd,0,0);
  if(wx.c>.02){ctx.globalAlpha=wx.c*.3;for(let i=0;i<5;i++){const wxp=hs(i,3)*5000+t*(12+i*2),wyp=hs(i,5)*5000+t*5,ddx=((wxp-cam.x)%5000+7500)%5000-2500,ddy=((wyp-cam.y)%5000+7500)%5000-2500,sw=(900+i*140)*z,sh2=(460+i*90)*z,sx=W_/2+ddx*z,sy=H_/2+ddy*z;if(sx>-sw&&sx<W_+sw&&sy>-sh2&&sy<H_+sh2)ctx.drawImage(cloud,sx-sw/2,sy-sh2/2,sw,sh2)}ctx.globalAlpha=1}
  let pr=0,pg=0,pb=0,pa=0; // dark + fog + season tint merged into ONE full-screen fill
  for(const l of[[28,40,56,wx.d],[fogC[0],fogC[1],fogC[2],wx.f*.8],[pal.tint[0],pal.tint[1],pal.tint[2],pal.tint[3]]]){const la=l[3];pr=pr*(1-la)+l[0]*la;pg=pg*(1-la)+l[1]*la;pb=pb*(1-la)+l[2]*la;pa=pa+la*(1-pa)}
  if(pa>.003){ctx.fillStyle=`rgba(${pr/pa|0},${pg/pa|0},${pb/pa|0},${pa})`;ctx.fillRect(0,0,W_,H_)}
  if(wx.f>.1){ctx.setTransform(Rd*z,0,0,Rd*z,Rd*(W_/2-cam.x*z),Rd*(H_/2-cam.y*z));ctx.globalAlpha=Math.min(1,wx.f*.9);drawCar();ctx.globalAlpha=1;ctx.setTransform(Rd,0,0,Rd,0,0)}
  drawParts(dt);
}

let last=-1,ema=.016,qT=0,calm=0,drawAcc=0;
function loop(now){
  if(last<0)last=now;
  const raw=Math.max(0,(now-last)/1000),dt=Math.min(.05,raw);last=now;t+=dt;
  if(raw<.2){ema+=(raw-ema)*.05;qT+=raw;
    if(qT>1.2){qT=0;
      if(ema>.026&&qs>.5){qs=Math.max(.5,qs*.86);rs();calm=0}
      else if(ema<.013&&qs<qsCap){if(++calm>6){qs=Math.min(qsCap,qs*1.1);rs();calm=0}}else calm=0}}
  updPal(dt);updSprites();step(dt);updColors(dt);updWx(dt);
  const sp=Math.hypot(car.vx,car.vy),px=cam.x,py=cam.y,f=Math.min(1,4*dt),hw_=W_/2/cam.z,hh_=H_/2/cam.z,k_=Math.min(1,1.6*dt);
  camDir[0]+=((sp>25?car.vx/sp:Math.cos(car.a))-camDir[0])*k_;camDir[1]+=((sp>25?car.vy/sp:Math.sin(car.a))-camDir[1])*k_;
  const dl=Math.hypot(camDir[0],camDir[1])||1,L=Math.min((MODES[mode].zo>.2?.5:.42)*Math.min(hw_,hh_),40+sp*.4),
  tx=car.x+camDir[0]/dl*L+Math.sin(t/157)*.05*hw_,ty=car.y+camDir[1]/dl*L+Math.sin(t/211+1)*.05*hh_;
  cam.x+=(tx-cam.x)*f;cam.y+=(ty-cam.y)*f;cam.dx=cam.x-px;cam.dy=cam.y-py;
  const zt=Math.max(.85,Math.min(W_/800,H_/600))*(1.1-MODES[mode].zo*Math.min(1,sp/MODES[mode].max));
  cam.z+=(zt-cam.z)*Math.min(1,2*dt);
  drawAcc+=dt;if(mode!==0||drawAcc>=.032){draw(drawAcc);drawAcc=0}   // red screensaver renders at ~30 fps
  requestAnimationFrame(loop);
}
updColors(0);pickWx();wx.f=wt.f;wx.c=wt.c;wx.d=wt.d;wx.w=wt.w.slice();ps.forEach(p=>spawn(p,true));
requestAnimationFrame(loop);
</script></body></html>
